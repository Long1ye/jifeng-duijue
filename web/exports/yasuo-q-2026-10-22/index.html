<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>亚索 Q 特效 · 当前游戏素材</title>
<style>body{margin:32px;background:#15212b;color:#e5edf0;font:15px/1.7 "Microsoft YaHei",sans-serif}h1{color:#dfc78d}main{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}section{padding:20px;background:#21313b;border:1px solid #526773;max-width:calc(100vw - 110px)}.stage{overflow:auto}canvas{display:block;image-rendering:pixelated;background:repeating-conic-gradient(#34434c 0% 25%,#293840 0% 50%) 0/24px 24px}button,select{margin:12px 8px 0 0;padding:7px 12px;font:inherit}a{color:#b9e2ee}input{width:220px}small{color:#a8bfca}</style>
<h1>亚索 Q · 特效动画提取</h1><p>当前游戏素材。Meowa 通用生成 → 序列图切片 → 按帧播放。下方为原尺寸慢放，不是游戏中的实际施法速度。</p><p><a href="PROMPTS.txt">查看原始提示词与命令</a> · <a href="MEOWA-PARAMETERS.json">生成参数</a> · <a href="README.txt">提取说明与游戏时序</a></p><main></main>
<script>const clips=[{"title": "Q1/Q2 出刺风刃", "image": "normal-q/thrust/runtime-atlas.png", "width": 512, "height": 256, "columns": 2, "frames": 8, "ms": 100, "folder": "normal-q/thrust"}, {"title": "Q1/Q2 命中风雾", "image": "normal-q/hit/runtime-atlas.png", "width": 512, "height": 512, "columns": 2, "frames": 4, "ms": 100, "folder": "normal-q/hit"}, {"title": "Q3 飞行旋风", "image": "q3/tornado/runtime-atlas.png", "width": 256, "height": 512, "columns": 4, "frames": 8, "ms": 125, "folder": "q3/tornado"}, {"title": "Q3 命中上升风流", "image": "q3/hit/runtime-atlas.png", "width": 512, "height": 512, "columns": 2, "frames": 4, "ms": 100, "folder": "q3/hit"}];let ready=0;for(const clip of clips){const section=document.createElement('section');section.innerHTML=`<h2>${clip.title}</h2><small>${clip.frames} 帧 · ${clip.width} × ${clip.height} · 原尺寸</small><div class="stage"><canvas width="${clip.width}" height="${clip.height}"></canvas></div><button>暂停</button><input aria-label="逐帧" type="range" min="0" max="${clip.frames-1}" value="0"><output></output><p><a href="${clip.folder}/preview.webp">透明 WebP 动画</a> · <a href="${clip.folder}/runtime-atlas.png">运行图集</a> · <a href="${clip.folder}/source-sheet.png">原始生成图</a></p>`;document.querySelector('main').append(section);const canvas=section.querySelector('canvas'),context=canvas.getContext('2d'),button=section.querySelector('button'),slider=section.querySelector('input'),label=section.querySelector('output'),image=new Image();let frame=0,playing=true;const draw=()=>{context.clearRect(0,0,canvas.width,canvas.height);context.imageSmoothingEnabled=false;context.drawImage(image,frame%clip.columns*clip.width,Math.floor(frame/clip.columns)*clip.height,clip.width,clip.height,0,0,clip.width,clip.height);slider.value=frame;label.textContent=` ${frame+1} / ${clip.frames}`};image.onload=()=>{draw();ready++;window.assetPreviewReady=ready===clips.length};image.src=clip.image;button.onclick=()=>{playing=!playing;button.textContent=playing?'暂停':'播放'};slider.oninput=()=>{playing=false;button.textContent='播放';frame=Number(slider.value);draw()};setInterval(()=>{if(playing&&image.complete&&image.naturalWidth){frame=(frame+1)%clip.frames;draw()}},clip.ms)};</script></html>
